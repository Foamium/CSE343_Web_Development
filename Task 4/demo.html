<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie Watchlist</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </head>
    <body>
        <div id="root">
            <script type="text/babel">
                const { useState } = React;

                function App() {
                    const [movies, setMovies] = useState([]);
                    const [title, setTitle] = useState("");

                    function addMovie(event){
                        event.preventDefault();
                        const trimmed = title.trim();
                        if (trimmed){
                            setMovies((currentMovies) => [...currentMovies, {id: Date.now(), title: trimmed, rating: 0, reviews: []}]);
                            setTitle("");
                        }
                    }

                    function removeMovie(movieId){
                        setMovies((currentMovies) => currentMovies.filter((movie) => movie.id !== movieId));
                    }

                    function rateMovie(movieId, rating) {
                        setMovies((currentMovies) => currentMovies.map((movie) => 
                            movie.id === movieId ? {...movie, rating} : movie
                        ));
                    }

                    function addReview(event, movieId) {
                        event.preventDefault();
                        const review = event.currentTarget.elements.review.value.trim()
                        if (review) {
                            setMovies((currentMovies) => currentMovies.map((movie) =>
                            movie.id === movieId ? {...movie, reviews: [...movie.reviews, review]} : movie
                        ))
                        }
                        event.currentTarget.reset();
                    }

                    return(
                    <main>
                        <header className="page-header">
                            <p className="eyebrow">YOUR PERSONAL COLLECTION</p>
                            <h1 className="mainheader">Movie Watchlist</h1>
                            <p className="subtitle">Catalogue your recently watched films</p>
                        </header>

                        <form className="movie-form" onSubmit={(event)=>addMovie(event)}>
                            <label htmlFor="primary-input">Add a movie</label>
                            <div className="input-row">
                                <input
                                id = "primary-input"
                                type = "text"
                                value={title}
                                onChange={(event) => setTitle(event.target.value)}
                                required
                                />
                                <button className="primary-button" type="submit">Add movie</button>
                            </div>
                        </form>

                        <section className="movie-list">
                            {movies.length === 0 ? 
                                <p>Start Cataloging</p>
                                : movies.map((movie) => (
                                <article className="movie-card" key={movie.id}>
                                    <div className="movie-header">
                                        <h2>{movie.title}</h2>
                                        <button className="removemovieButton" onClick={() => removeMovie(movie.id)}>Remove</button>
                                    </div>

                                    <div className="rating-section">
                                        <span className="rating-span">Your rating</span>
                                        <div className="rating-controls">
                                            {[1,2,3,4,5].map((rating)=>(
                                                <button
                                                className = "rating-button"
                                                key = {rating}
                                                type="button"
                                                onClick={()=>rateMovie(movie.id,rating)}
                                                aria-label={`${rating} ${rating === 1 ? "star" : "stars"}`}
                                                aria-pressed={movie.rating===rating}
                                                >⭐
                                                </button>
                                        ))}
                                        <span className="rating-show">
                                            {movie.rating > 0 ? `${"⭐".repeat(movie.rating)}`
                                                : "Not rated yet"
                                            }
                                        </span>
                                        </div>
                                    </div>

                                    <div className="reviews-section">
                                        <span className="reviews-span">Reviews</span>
                                        {movie.reviews.length === 0 ? <p>No reviews yet</p>
                                            : <ul className="review-list">
                                              {movie.reviews.map((review, index) => (
                                                <li className="review-listing" key={`${movie.id}-${index}`}>
                                                    {review}
                                                </li>
                                            )
                                            )}
                                            </ul>
                                        }
                                        <form className="review-form" onSubmit={(event)=>addReview(event, movie.id)}>
                                        <input
                                        id={`review-${movie.id}`}
                                        name="review"
                                        type="text"
                                        required
                                        />
                                        <button className="review-button" type="submit">Add review</button>
                                        </form>
                                    </div>
                                </article>)
                            )}
                        </section>
                    </main>);
                }

                const root = ReactDOM.createRoot(document.getElementById("root"));
                root.render(<App />);
            </script>
        </div>
    </body>
</html>
